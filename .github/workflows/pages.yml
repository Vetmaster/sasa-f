name: Deploy SporX web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare clean web artifact
        shell: bash
        run: |
          set -euo pipefail

          deploy_dir="${RUNNER_TEMP}/sasa-f-pages"
          mkdir -p "${deploy_dir}/.well-known"

          web_files=(
            .nojekyll
            index.html
            app.js
            styles.css
            manifest.webmanifest
            service-worker.js
            custom-domain.js
            firebase-web-config.js
            local-db.js
            students-seed.js
            supabase-data.js
            android-version.json
            sasa-f-banner-icon.svg
            sasa-f-favicon-v3.png
            sasa-f-icon-v3.svg
            sasa-f-notification-badge.png
          )

          for file in "${web_files[@]}"; do
            install -m 0644 "${file}" "${deploy_dir}/${file}"
          done
          install -m 0644 .well-known/assetlinks.json "${deploy_dir}/.well-known/assetlinks.json"

          echo "Prepared GitHub Pages artifact:"
          find "${deploy_dir}" -type f -print | sed "s#${deploy_dir}/##" | sort

          echo "${deploy_dir}" > "${RUNNER_TEMP}/sasa-f-pages-path"
      - name: Verify web artifact contents
        shell: bash
        run: |
          set -euo pipefail

          deploy_dir="$(cat "${RUNNER_TEMP}/sasa-f-pages-path")"
          forbidden_paths=(
            android
            supabase
            .git
            .github
            .gitignore
            README.md
          )

          for path in "${forbidden_paths[@]}"; do
            if [[ -e "${deploy_dir}/${path}" ]]; then
              echo "Forbidden deployment path found: ${path}" >&2
              exit 1
            fi
          done

          if find "${deploy_dir}" -type f \( -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo "Environment file found in deployment artifact." >&2
            exit 1
          fi

          test -f "${deploy_dir}/index.html"
          test -f "${deploy_dir}/app.js"
          test -f "${deploy_dir}/styles.css"
          test -f "${deploy_dir}/manifest.webmanifest"
          test -f "${deploy_dir}/service-worker.js"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/sasa-f-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
